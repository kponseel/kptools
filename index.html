<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Top 100 Streaming FR</title>
<style>
  :root{
    --bg:#0b0b10;
    --bg-elev:#15151d;
    --bg-elev2:#1d1d28;
    --txt:#f4f4f7;
    --txt-dim:#a0a0b0;
    --border:#2a2a38;
    --accent:#7c5cff;
    --netflix:#e50914;
    --prime:#00a8e1;
    --disney:#1f6cff;
    --gold:#ffc83d;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(24px + var(--safe-bottom));
  }

  /* ---- Header ---- */
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(11,11,16,.82);
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--border);
    padding:calc(12px + var(--safe-top)) 16px 10px;
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand h1{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:0;}
  .brand .badge100{
    font-size:11px;font-weight:800;color:#0b0b10;background:var(--gold);
    padding:2px 7px;border-radius:999px;
  }
  .brand p{margin:2px 0 0;font-size:12px;color:var(--txt-dim);}

  /* ---- Search ---- */
  .search{position:relative;margin-top:12px;}
  .search input{
    width:100%;border:1px solid var(--border);background:var(--bg-elev);
    color:var(--txt);font-size:16px;border-radius:12px;
    padding:11px 12px 11px 38px;outline:none;
  }
  .search input::placeholder{color:var(--txt-dim);}
  .search input:focus{border-color:var(--accent);}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:var(--txt-dim);}

  /* ---- Chips ---- */
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;border:1px solid var(--border);background:var(--bg-elev);
    color:var(--txt-dim);font-size:13px;font-weight:600;
    padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
    transition:.15s;
  }
  .chip[aria-pressed="true"]{background:var(--txt);color:#0b0b10;border-color:var(--txt);}
  .chip[data-plat="netflix"][aria-pressed="true"]{background:var(--netflix);border-color:var(--netflix);color:#fff;}
  .chip[data-plat="prime"][aria-pressed="true"]{background:var(--prime);border-color:var(--prime);color:#04222e;}
  .chip[data-plat="disney"][aria-pressed="true"]{background:var(--disney);border-color:var(--disney);color:#fff;}

  /* ---- Toolbar (count + sort) ---- */
  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:14px 16px 4px;
  }
  .count{font-size:13px;color:var(--txt-dim);}
  .count b{color:var(--txt);}
  .sort{display:flex;align-items:center;gap:6px;}
  .sort label{font-size:12px;color:var(--txt-dim);}
  .sort select{
    background:var(--bg-elev);color:var(--txt);border:1px solid var(--border);
    border-radius:9px;padding:6px 8px;font-size:13px;outline:none;
  }

  /* ---- List ---- */
  .list{padding:8px 12px 0;display:flex;flex-direction:column;gap:10px;}
  .card{
    display:flex;gap:12px;background:var(--bg-elev);border:1px solid var(--border);
    border-radius:14px;padding:10px;align-items:stretch;
  }
  .poster{
    position:relative;flex:0 0 64px;width:64px;height:96px;border-radius:9px;
    overflow:hidden;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:22px;color:rgba(255,255,255,.9);
    text-shadow:0 1px 6px rgba(0,0,0,.4);
  }
  .poster .rank{
    position:absolute;top:0;left:0;background:rgba(0,0,0,.55);
    color:#fff;font-size:11px;font-weight:800;padding:2px 6px;border-bottom-right-radius:8px;
  }
  .info{flex:1;min-width:0;display:flex;flex-direction:column;}
  .titleline{display:flex;align-items:flex-start;gap:8px;}
  .titleline h2{font-size:15px;font-weight:700;margin:0;line-height:1.25;}
  .rating{
    flex:0 0 auto;margin-left:auto;display:inline-flex;align-items:center;gap:3px;
    background:var(--bg-elev2);border:1px solid var(--border);border-radius:8px;
    padding:3px 7px;font-size:13px;font-weight:800;color:var(--gold);
  }
  .rating .max{color:var(--txt-dim);font-weight:600;font-size:11px;}
  .meta{margin-top:5px;font-size:12px;color:var(--txt-dim);}
  .meta .dot{margin:0 6px;opacity:.5;}
  .tags{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--border);color:var(--txt-dim);}
  .pill.type{background:var(--bg-elev2);}
  .pill.plat{color:#fff;border:none;}
  .pill.plat.netflix{background:var(--netflix);}
  .pill.plat.prime{background:var(--prime);color:#04222e;}
  .pill.plat.disney{background:var(--disney);}

  .empty{text-align:center;color:var(--txt-dim);padding:48px 24px;font-size:14px;}

  footer{
    margin-top:22px;padding:0 18px;text-align:center;
    font-size:11px;color:var(--txt-dim);line-height:1.5;
  }
  footer a{color:var(--txt-dim);}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Top Streaming FR</h1>

    </div>
    <p>Films &amp; séries les mieux notés sur Netflix, Prime Video et Disney+ (France)</p>

    <div class="search">

      <input id="q" type="search" inputmode="search" placeholder="Rechercher un titre, un genre…" autocomplete="off">
    </div>

      <button class="chip" data-plat="all" aria-pressed="true">Toutes les plateformes</button>
      <button class="chip" data-plat="netflix" aria-pressed="false">Netflix</button>
      <button class="chip" data-plat="prime" aria-pressed="false">Prime Video</button>
      <button class="chip" data-plat="disney" aria-pressed="false">Disney+</button>
    </div>
    <div class="chips" id="typeChips">
      <button class="chip" data-type="all" aria-pressed="true">Tout</button>
      <button class="chip" data-type="film" aria-pressed="false">Films</button>
      <button class="chip" data-type="serie" aria-pressed="false">Séries</button>
    </div>
  </header>

  <div class="toolbar">
    <span class="count" id="count"></span>
    <div class="sort">
      <label for="sort">Trier</label>
      <select id="sort">
        <option value="rank">Classement</option>
        <option value="rating">Note ↓</option>
        <option value="year">Plus récent</option>
        <option value="title">A → Z</option>
      </select>
    </div>
  </div>

  <main class="list" id="list"></main>

  <footer>
    Disponibilités indicatives pour la France et susceptibles d'évoluer selon les catalogues.<br>
    Notes inspirées des évaluations publiques · Données intégrées hors-ligne.

const PLAT = {
  netflix:{name:"Netflix", g:"linear-gradient(135deg,#7a0008,#e50914)"},
  prime:{name:"Prime Video", g:"linear-gradient(135deg,#013a4d,#00a8e1)"},
  disney:{name:"Disney+", g:"linear-gradient(135deg,#0a1c4d,#1f6cff)"}
};

/* Classement global figé selon la note (puis l'année) */
const RANKED = [...DATA].sort((a,b)=> b.rating-a.rating || b.year-a.year || a.t.localeCompare(b.t,'fr'));
RANKED.forEach((m,i)=> m.rank = i+1);

const state = { q:"", plat:"all", type:"all", sort:"rank" };

const el = id => document.getElementById(id);
const listEl = el("list"), countEl = el("count");

function initials(title){
  const clean = title.replace(/[^\p{L}\p{N} ]/gu,"").trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  return ((parts[0]?.[0]||"") + (parts[1]?.[0]||"")).toUpperCase() || "?";
}

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

function apply(){
  const q = norm(state.q.trim());
  let rows = RANKED.filter(m=>{
    if(state.plat!=="all" && m.plat!==state.plat) return false;
    if(state.type!=="all" && m.type!==state.type) return false;
    if(q && !(norm(m.t).includes(q) || norm(m.genre).includes(q))) return false;
    return true;
  });

  if(state.sort==="rating") rows.sort((a,b)=> b.rating-a.rating || a.rank-b.rank);
  else if(state.sort==="year") rows.sort((a,b)=> b.year-a.year || a.rank-b.rank);
  else if(state.sort==="title") rows.sort((a,b)=> a.t.localeCompare(b.t,'fr'));
  else rows.sort((a,b)=> a.rank-b.rank);

  render(rows);
}

function render(rows){
  countEl.innerHTML = `<b>${rows.length}</b> titre${rows.length>1?"s":""}`;
  if(!rows.length){
    listEl.innerHTML = `<div class="empty">Aucun titre ne correspond à votre recherche.</div>`;
    return;
  }
  listEl.innerHTML = rows.map(m=>{
    const p = PLAT[m.plat];
    const typeLabel = m.type==="film" ? "Film" : "Série";
    return `<article class="card">
      <div class="poster" style="background:${p.g}">
        <span class="rank">#${m.rank}</span>
        ${initials(m.t)}
      </div>
      <div class="info">
        <div class="titleline">
          <h2>${escapeHtml(m.t)}</h2>
          <span class="rating">★ ${m.rating.toFixed(1)}<span class="max">/10</span></span>
        </div>
        <div class="meta">${m.year}<span class="dot">•</span>${escapeHtml(m.genre)}</div>
        <div class="tags">
          <span class="pill type">${typeLabel}</span>
          <span class="pill plat ${m.plat}">${p.name}</span>
        </div>
      </div>
    </article>`;
  }).join("");
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---- Events ---- */
el("q").addEventListener("input", e=>{ state.q = e.target.value; apply(); });
el("sort").addEventListener("change", e=>{ state.sort = e.target.value; apply(); });

function wireChips(containerId, key){
  const box = el(containerId);
  box.addEventListener("click", e=>{
    const btn = e.target.closest(".chip");
    if(!btn) return;
    state[key] = btn.dataset[key];
    box.querySelectorAll(".chip").forEach(c=> c.setAttribute("aria-pressed", c===btn ? "true":"false"));
    apply();
  });
}
wireChips("platChips","plat");
wireChips("typeChips","type");

apply();
