<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>On regarde quoi ?</title>
<style>
  :root{
    --bg:#0a0a12; --bg2:#13131e; --bg3:#1c1c2b;
    --txt:#f5f5fa; --dim:#9b9bb0; --border:#2a2a3c;
    --accent:#7c5cff; --accent2:#ff4d8d; --gold:#ffc83d;
    --netflix:#e50914; --prime:#00a8e1; --disney:#1f6cff;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 60% at 50% -10%, #1a1430 0%, var(--bg) 55%);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;
    padding-bottom:calc(28px + var(--sb));
  }
  button{font-family:inherit;}

  header{padding:calc(14px + var(--st)) 16px 6px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand h1{font-size:23px;font-weight:900;letter-spacing:-.5px;margin:0;
    background:linear-gradient(90deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand .emo{font-size:22px;}
  .brand p{margin:3px 0 0;font-size:12.5px;color:var(--dim);}
  .brand .stat{margin:2px 0 0;font-size:11px;color:var(--dim);opacity:.8;}

  .search{position:relative;margin-top:13px;}
  .search input{width:100%;border:1px solid var(--border);background:var(--bg2);color:var(--txt);
    font-size:16px;border-radius:13px;padding:12px 12px 12px 40px;outline:none;}
  .search input::placeholder{color:var(--dim);}
  .search input:focus{border-color:var(--accent);}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:var(--dim);}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:11px 0 1px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;border:1px solid var(--border);background:var(--bg2);color:var(--dim);
    font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s;}
  .chip[aria-pressed="true"]{background:var(--txt);color:#0a0a12;border-color:var(--txt);}
  .chip[data-plat="netflix"][aria-pressed="true"]{background:var(--netflix);border-color:var(--netflix);color:#fff;}
  .chip[data-plat="prime"][aria-pressed="true"]{background:var(--prime);border-color:var(--prime);color:#04222e;}
  .chip[data-plat="disney"][aria-pressed="true"]{background:var(--disney);border-color:var(--disney);color:#fff;}
  .chip.fav[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:#fff;}

  .bigactions{display:flex;gap:10px;margin:13px 16px 0;}
  .surprise,.swipebtn{flex:1;border:none;cursor:pointer;color:#fff;font-size:15px;font-weight:800;
    padding:14px 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s;}
  .surprise{background:linear-gradient(100deg,var(--accent),var(--accent2));box-shadow:0 8px 22px -10px rgba(124,92,255,.8);}
  .swipebtn{background:linear-gradient(100deg,#ff7a45,var(--accent2));box-shadow:0 8px 22px -10px rgba(255,77,141,.8);}
  .surprise:active,.swipebtn:active{transform:scale(.97);}
  .surprise .dice{font-size:19px;}

  .controls{display:flex;align-items:center;gap:8px;padding:13px 16px 2px;}
  .controls select{flex:1;min-width:0;background:var(--bg2);color:var(--txt);border:1px solid var(--border);
    border-radius:10px;padding:9px 8px;font-size:13px;outline:none;}
  .viewtg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex:0 0 auto;}
  .viewtg button{background:var(--bg2);border:none;color:var(--dim);padding:9px 12px;cursor:pointer;font-size:16px;line-height:1;}
  .viewtg button[aria-pressed="true"]{background:var(--accent);color:#fff;}

  .count{padding:12px 16px 2px;font-size:12.5px;color:var(--dim);}
  .count b{color:var(--txt);}

  /* ---- Grille ---- */
  .results.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:11px;padding:8px 14px 0;}
  .tile{position:relative;aspect-ratio:2/3;border-radius:13px;overflow:hidden;cursor:pointer;border:none;padding:0;
    background:var(--g);box-shadow:0 4px 14px -6px rgba(0,0,0,.6);text-align:left;color:#fff;}
  .tile .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:46px;font-weight:900;color:rgba(255,255,255,.13);letter-spacing:-2px;}
  .tile .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.15) 48%,transparent 70%);}
  .tile .cap{position:absolute;left:8px;right:8px;bottom:8px;}
  .tile .ct{font-size:12.5px;font-weight:800;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,.6);}
  .tile .cm{font-size:10.5px;color:#d8d8e6;margin-top:2px;}
  .badge-rate{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);
    color:var(--gold);font-size:11.5px;font-weight:800;padding:3px 6px;border-radius:8px;}
  .pdot{position:absolute;top:9px;left:9px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.35);}
  .pdot.netflix{background:var(--netflix);} .pdot.prime{background:var(--prime);} .pdot.disney{background:var(--disney);}
  .tile .fav{position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(0,0,0,.5);backdrop-filter:blur(3px);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1;}
  .tile .fav.on{color:var(--accent2);}

  /* ---- Liste ---- */
  .results.list{display:flex;flex-direction:column;gap:10px;padding:8px 14px 0;}
  .card{display:flex;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:10px;cursor:pointer;}
  .card .mini{flex:0 0 56px;width:56px;height:84px;border-radius:9px;background:var(--g);position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:rgba(255,255,255,.85);}
  .card .info{flex:1;min-width:0;display:flex;flex-direction:column;}
  .card .tl{display:flex;gap:8px;align-items:flex-start;}
  .card .tl h2{font-size:15px;font-weight:700;margin:0;line-height:1.25;}
  .card .rt{margin-left:auto;flex:0 0 auto;background:var(--bg3);border:1px solid var(--border);border-radius:8px;
    padding:3px 7px;font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap;}
  .card .meta{margin-top:5px;font-size:12px;color:var(--dim);}
  .card .tags{margin-top:auto;padding-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--border);color:var(--dim);}
  .pill.plat{color:#fff;border:none;}
  .pill.plat.netflix{background:var(--netflix);} .pill.plat.prime{background:var(--prime);color:#04222e;} .pill.plat.disney{background:var(--disney);}
  .card .heart{margin-left:auto;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;line-height:1;align-self:center;}
  .card .heart.on{color:var(--accent2);}

  .empty{text-align:center;color:var(--dim);padding:46px 24px;font-size:14px;}

  /* ---- Overlays ---- */
  .ov{position:fixed;inset:0;z-index:50;display:none;}
  .ov.show{display:block;}
  .ov .back{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(2px);}

  /* roulette */
  #roul .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);
    background:var(--bg2);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px -12px #000;}
  .rhead{height:148px;background:var(--g);position:relative;display:flex;align-items:center;justify-content:center;}
  .rhead .wm{font-size:62px;font-weight:900;color:rgba(255,255,255,.18);}
  .rhead .rrate{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:var(--gold);font-weight:800;font-size:14px;padding:4px 9px;border-radius:9px;}
  .rbody{padding:15px 16px 16px;}
  .rkicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
  .rbody h3{margin:5px 0 4px;font-size:20px;font-weight:800;line-height:1.2;}
  .rmeta{font-size:13px;color:var(--dim);margin-bottom:6px;}
  .rtags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .ractions{display:flex;gap:9px;}
  .ractions button{flex:1;border:none;cursor:pointer;font-weight:800;font-size:14px;padding:12px;border-radius:12px;}
  .btn-replay{background:var(--bg3);color:var(--txt);border:1px solid var(--border)!important;}
  .btn-ok{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;}
  .spinning .ractions{opacity:.35;pointer-events:none;}

  /* bottom sheet détail */
  #sheet .box{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-top-left-radius:22px;border-top-right-radius:22px;
    padding-bottom:calc(16px + var(--sb));transform:translateY(0);box-shadow:0 -10px 40px -10px #000;}
  .shead{height:140px;background:var(--g);position:relative;display:flex;align-items:center;justify-content:center;border-top-left-radius:22px;border-top-right-radius:22px;}
  .shead .wm{font-size:60px;font-weight:900;color:rgba(255,255,255,.18);}
  .grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.5);}
  .sbody{padding:15px 18px 4px;}
  .sbody h3{margin:0 0 5px;font-size:21px;font-weight:800;}
  .sbody .smeta{color:var(--dim);font-size:13.5px;margin-bottom:10px;}
  .srow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .sactions{display:flex;gap:9px;padding:0 18px;}
  .sactions button{flex:1;border:none;cursor:pointer;font-weight:800;font-size:14px;padding:12px;border-radius:12px;}

  /* ---- Affiches TMDB (optionnel) ---- */
  .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s;}
  .haspim>.pimg{opacity:1;}
  .haspim>.wm{display:none;}
  .gear{margin-left:auto;background:var(--bg2);border:1px solid var(--border);color:var(--txt);
    width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;line-height:1;flex:0 0 auto;}
  .watchbtn{display:block;text-align:center;text-decoration:none;color:#fff;font-weight:800;font-size:15px;padding:13px;border-radius:12px;}
  .watchbtn.netflix{background:var(--netflix);}
  .watchbtn.prime{background:var(--prime);color:#04222e;}
  .watchbtn.disney{background:var(--disney);}

  /* ---- Mode Swipe (Tinder) ---- */
  .ov.full{background:var(--bg);}
  .ov.full .box{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(12px + var(--st)) 16px calc(14px + var(--sb));}
  .swtop{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .swtop h2{font-size:18px;font-weight:800;margin:0;flex:1;}
  .swtop .close{background:var(--bg2);border:1px solid var(--border);color:var(--txt);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;line-height:1;}
  /* setup */
  .setup{overflow-y:auto;}
  .setup .lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px;}
  .setup .chips{flex-wrap:wrap;overflow:visible;padding:0;}
  .setup select{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--border);border-radius:11px;padding:11px;font-size:15px;outline:none;}
  .setup .start{margin-top:24px;width:100%;border:none;cursor:pointer;color:#fff;font-size:16px;font-weight:800;padding:15px;border-radius:14px;
    background:linear-gradient(100deg,#ff7a45,var(--accent2));}
  .setup .start:disabled{opacity:.5;}
  .setup .hint{margin-top:10px;text-align:center;font-size:12.5px;color:var(--dim);}
  /* deck */
  .deck{position:relative;flex:1;margin:4px 0 14px;touch-action:none;}
  .swcard{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--g);
    box-shadow:0 18px 40px -16px rgba(0,0,0,.8);will-change:transform;}
  .swcard .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 6%,rgba(0,0,0,.2) 46%,transparent 66%);}
  .swcard .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:rgba(255,255,255,.14);}
  .swcard .top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .swcard .rate{background:rgba(0,0,0,.6);color:var(--gold);font-weight:800;font-size:15px;padding:5px 10px;border-radius:10px;}
  .swcard .cap{position:absolute;left:16px;right:16px;bottom:16px;}
  .swcard .cap h3{margin:0 0 6px;font-size:26px;font-weight:900;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  .swcard .cap .m{font-size:13.5px;color:#e0e0ee;margin-bottom:9px;}
  .swcard .cap .tg{display:flex;gap:6px;flex-wrap:wrap;}
  .stamp{position:absolute;top:26px;font-size:30px;font-weight:900;letter-spacing:1px;padding:6px 14px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-16deg);}
  .stamp.like{left:18px;color:#22e06b;border-color:#22e06b;}
  .stamp.nope{right:18px;color:#ff4d6a;border-color:#ff4d6a;transform:rotate(16deg);}
  .swcontrols{display:flex;align-items:center;justify-content:center;gap:18px;}
  .swbtn{border:none;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--bg2);box-shadow:0 6px 16px -8px #000;border:1px solid var(--border);}
  .swbtn.nope{width:62px;height:62px;font-size:26px;color:#ff4d6a;}
  .swbtn.like{width:62px;height:62px;font-size:26px;color:#22e06b;}
  .swbtn.undo{width:48px;height:48px;font-size:19px;color:var(--gold);}
  .swbtn.info{width:48px;height:48px;font-size:18px;color:var(--prime);}
  .swbtn:active{transform:scale(.92);}
  .swbtn:disabled{opacity:.35;}
  .swend{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .swend .big{font-size:54px;margin-bottom:6px;}
  .swend h3{font-size:22px;font-weight:800;margin:0 0 6px;}
  .swend p{color:var(--dim);font-size:14px;margin:0 0 20px;}
  .swend button{border:none;cursor:pointer;font-weight:800;font-size:15px;padding:13px 18px;border-radius:13px;margin:5px;}
  .swend .primary{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;}
  .swend .ghost{background:var(--bg2);color:var(--txt);border:1px solid var(--border);}

  footer{margin-top:24px;padding:0 20px;text-align:center;font-size:11px;color:var(--dim);line-height:1.55;}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="emo">🍿</span>
      <div>
        <h1>On regarde quoi ?</h1>
      </div>
      <button id="gear" class="gear" title="Affiches (clé TMDB)" aria-label="Réglages affiches">⚙️</button>
    </div>
    <p>Les mieux notés sur Netflix, Prime Video &amp; Disney+ (France)</p>
    <p class="stat" id="stat"></p>

    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q" type="search" inputmode="search" placeholder="Rechercher un titre, un genre…" autocomplete="off">
    </div>

    <div class="chips" id="platChips">
      <button class="chip" data-plat="all" aria-pressed="true">Toutes</button>
      <button class="chip" data-plat="netflix" aria-pressed="false">Netflix</button>
      <button class="chip" data-plat="prime" aria-pressed="false">Prime Video</button>
      <button class="chip" data-plat="disney" aria-pressed="false">Disney+</button>
    </div>
    <div class="chips" id="typeChips">
      <button class="chip" data-type="all" aria-pressed="true">Tout</button>
      <button class="chip" data-type="film" aria-pressed="false">Films</button>
      <button class="chip" data-type="serie" aria-pressed="false">Séries</button>
      <button class="chip fav" id="favToggle" aria-pressed="false">❤️ Ma liste</button>
    </div>
  </header>

  <div class="bigactions">
    <button class="surprise" id="surprise"><span class="dice">🎲</span> Surprends-moi</button>
    <button class="swipebtn" id="swipeBtn">💘 Mode Swipe</button>
  </div>

  <div class="controls">
    <select id="genre"><option value="all">Tous les genres</option></select>
    <select id="sort">
      <option value="rating">Note ↓</option>
      <option value="year">Plus récent</option>
      <option value="title">A → Z</option>
    </select>
    <div class="viewtg" id="viewtg">
      <button data-view="grid" aria-pressed="true" title="Grille">▦</button>
      <button data-view="list" aria-pressed="false" title="Liste">☰</button>
    </div>
  </div>

  <div class="count" id="count"></div>
  <main class="results grid" id="results"></main>

  <footer>
    Disponibilités indicatives (France) et susceptibles d'évoluer selon les catalogues.<br>
    Notes inspirées des évaluations publiques · 100 titres par plateforme · Données détachées (<code>data.js</code>).
  </footer>

  <!-- Roulette -->
  <div class="ov" id="roul">
    <div class="back" data-close></div>
    <div class="box" id="roulBox"></div>
  </div>
  <!-- Détail -->
  <div class="ov" id="sheet">
    <div class="back" data-close></div>
    <div class="box" id="sheetBox"></div>
  </div>
  <!-- Mode Swipe -->
  <div class="ov full" id="swipe">
    <div class="box" id="swipeBox"></div>
  </div>

<script src="data.js"></script>
<script>
(function(){
  const DATA = (window.DATA||[]).slice();
  if(!DATA.length){ document.getElementById('results').innerHTML='<div class="empty">Base de données introuvable (data.js non chargé).</div>'; return; }

  const PLAT = {netflix:"Netflix", prime:"Prime Video", disney:"Disney+"};
  const FAVKEY = "orq_fav_v1";

  const $ = id => document.getElementById(id);
  const resultsEl=$('results'), countEl=$('count');

  /* favoris (localStorage) */
  let favs = new Set();
  try{ favs = new Set(JSON.parse(localStorage.getItem(FAVKEY)||"[]")); }catch(e){}
  const isFav = t => favs.has(t);
  function toggleFav(t){ favs.has(t)?favs.delete(t):favs.add(t); try{localStorage.setItem(FAVKEY,JSON.stringify([...favs]));}catch(e){} updateFavChip(); }
  function updateFavChip(){ $('favToggle').textContent = favs.size ? `❤️ Ma liste (${favs.size})` : "❤️ Ma liste"; }

  const state={q:"",plat:"all",type:"all",genre:"all",sort:"rating",view:"grid",favOnly:false};
  let filtered=[];

  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const esc = s => s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function initials(t){const p=t.replace(/[^\p{L}\p{N} ]/gu,"").trim().split(/\s+/).filter(Boolean);return ((p[0]?.[0]||"")+(p[1]?.[0]||"")).toUpperCase()||"?";}
  function hueOf(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%360;return h;}
  function grad(t){const h=hueOf(t);return `linear-gradient(150deg,hsl(${h} 58% 34%),hsl(${(h+50)%360} 62% 17%))`;}
  const typeLabel = m => m.type==="film"?"Film":"Série";

  /* ---- liens "Regarder sur la plateforme" (recherche, sans clé) ---- */
  const WATCH = {
    netflix: t=>`https://www.netflix.com/search?q=${encodeURIComponent(t)}`,
    prime:   t=>`https://www.primevideo.com/search/?phrase=${encodeURIComponent(t)}`,
    disney:  t=>`https://www.disneyplus.com/search?q=${encodeURIComponent(t)}`
  };
  const watchUrl = m => WATCH[m.plat](m.t);
  const watchBtn = m => `<a class="watchbtn ${m.plat}" href="${watchUrl(m)}" target="_blank" rel="noopener">▶ Regarder sur ${PLAT[m.plat]}</a>`;

  /* ---- affiches TMDB (optionnel, nécessite une clé gratuite) ---- */
  const TMDBK="orq_tmdb_key", PCACHE="orq_posters_v1";
  let tmdbKey=""; try{tmdbKey=localStorage.getItem(TMDBK)||"";}catch(e){}
  let posters={}; try{posters=JSON.parse(localStorage.getItem(PCACHE)||"{}");}catch(e){}
  const savePosters=()=>{try{localStorage.setItem(PCACHE,JSON.stringify(posters));}catch(e){}};
  async function ensurePoster(m){
    if(!tmdbKey || posters[m.t]!==undefined) return posters[m.t];
    posters[m.t]=""; // marque "en cours / aucune" pour éviter les requêtes répétées
    try{
      const type=m.type==="film"?"movie":"tv";
      const yk=m.type==="film"?"primary_release_year":"first_air_date_year";
      const url=`https://api.themoviedb.org/3/search/${type}?api_key=${encodeURIComponent(tmdbKey)}&language=fr-FR&include_adult=false&query=${encodeURIComponent(m.t)}&${yk}=${m.year}`;
      const j=await (await fetch(url)).json();
      const hit=(j.results||[]).find(x=>x.poster_path);
      if(hit){ posters[m.t]="https://image.tmdb.org/t/p/w342"+hit.poster_path; }
      savePosters();
    }catch(e){}
    return posters[m.t];
  }
  function setPoster(el,url){
    if(!url || el.classList.contains('haspim') || el.querySelector(':scope>.pimg')) return;
    const img=new Image(); img.className='pimg'; img.alt=''; img.decoding='async';
    img.onload=()=>el.classList.add('haspim');
    img.onerror=()=>img.remove();
    img.src=url; el.insertBefore(img, el.firstChild);
  }
  function loadHeadPoster(el,m){
    if(!el||!m) return;
    if(posters[m.t]) setPoster(el,posters[m.t]);
    else if(tmdbKey) ensurePoster(m).then(u=>{ if(u) setPoster(el,u); });
  }
  let io=null;
  function setupPosters(){
    if(io){io.disconnect();io=null;}
    if(!tmdbKey) return;
    io=new IntersectionObserver(ents=>{ents.forEach(en=>{
      if(!en.isIntersecting) return;
      const el=en.target; io.unobserve(el); const m=byTitle(el.dataset.t);
      if(m) loadHeadPoster(el,m);
    });},{rootMargin:"250px"});
    resultsEl.querySelectorAll('[data-poster]').forEach(el=>{
      const m=byTitle(el.dataset.t);
      if(m && posters[m.t]) setPoster(el,posters[m.t]); else io.observe(el);
    });
  }

  /* genres dynamiques */
  const genres=[...new Set(DATA.flatMap(m=>m.genre.split(" · ")))].sort((a,b)=>a.localeCompare(b,'fr'));
  $('genre').insertAdjacentHTML('beforeend', genres.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join(""));

  $('stat').textContent = `${DATA.length} titres · 100 par plateforme`;

  function computeFiltered(){
    const q=norm(state.q.trim());
    filtered = DATA.filter(m=>{
      if(state.plat!=="all" && m.plat!==state.plat) return false;
      if(state.type!=="all" && m.type!==state.type) return false;
      if(state.genre!=="all" && !m.genre.split(" · ").includes(state.genre)) return false;
      if(state.favOnly && !isFav(m.t)) return false;
      if(q && !(norm(m.t).includes(q)||norm(m.genre).includes(q))) return false;
      return true;
    });
    if(state.sort==="rating") filtered.sort((a,b)=>b.rating-a.rating||b.year-a.year);
    else if(state.sort==="year") filtered.sort((a,b)=>b.year-a.year||b.rating-a.rating);
    else filtered.sort((a,b)=>a.t.localeCompare(b.t,'fr'));
  }

  function tileHTML(m){
    return `<article class="tile" data-t="${esc(m.t)}" data-poster style="--g:${grad(m.t)}">
      <span class="wm">${initials(m.t)}</span><span class="scrim"></span>
      <span class="pdot ${m.plat}"></span>
      <span class="badge-rate">★ ${m.rating.toFixed(1)}</span>
      <button class="fav ${isFav(m.t)?'on':''}" data-fav="${esc(m.t)}" aria-label="Ajouter à ma liste">${isFav(m.t)?'♥':'♡'}</button>
      <span class="cap"><span class="ct">${esc(m.t)}</span><span class="cm">${typeLabel(m)} · ${m.year}</span></span>
    </article>`;
  }
  function cardHTML(m){
    return `<article class="card" data-t="${esc(m.t)}" style="--g:${grad(m.t)}">
      <div class="mini" data-t="${esc(m.t)}" data-poster><span class="wm">${initials(m.t)}</span></div>
      <div class="info">
        <div class="tl"><h2>${esc(m.t)}</h2><span class="rt">★ ${m.rating.toFixed(1)}</span></div>
        <div class="meta">${typeLabel(m)} · ${m.year} · ${esc(m.genre)}</div>
        <div class="tags">
          <span class="pill plat ${m.plat}">${PLAT[m.plat]}</span>
          <button class="heart ${isFav(m.t)?'on':''}" data-fav="${esc(m.t)}" aria-label="Ajouter à ma liste">${isFav(m.t)?'♥':'♡'}</button>
        </div>
      </div>
    </article>`;
  }

  function render(){
    computeFiltered();
    resultsEl.className = "results "+state.view;
    countEl.innerHTML = `<b>${filtered.length}</b> résultat${filtered.length>1?'s':''}`;
    $('surprise').disabled = filtered.length===0;
    $('surprise').style.opacity = filtered.length===0 ? .5 : 1;
    if(!filtered.length){ resultsEl.innerHTML='<div class="empty">Aucun titre ne correspond. Élargis tes filtres 🎬</div>'; return; }
    const fn = state.view==="grid"?tileHTML:cardHTML;
    resultsEl.innerHTML = filtered.map(fn).join("");
    setupPosters();
  }

  /* ---- interactions liste/grille (délégation) ---- */
  resultsEl.addEventListener('click', e=>{
    const favBtn = e.target.closest('[data-fav]');
    if(favBtn){ e.stopPropagation(); const t=favBtn.dataset.fav; toggleFav(t);
      const on=isFav(t); favBtn.classList.toggle('on',on); favBtn.textContent=on?'♥':'♡';
      if(state.favOnly && !on) render(); return; }
    const item = e.target.closest('[data-t]');
    if(item) openSheet(byTitle(item.dataset.t));
  });
  const byTitle = t => DATA.find(m=>m.t===t);

  /* ---- chips ---- */
  function wireChips(id,key){const box=$(id);box.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b||!b.dataset[key])return;
    state[key]=b.dataset[key];box.querySelectorAll('.chip').forEach(c=>{if(c.dataset[key])c.setAttribute('aria-pressed',c===b?'true':'false');});render();});}
  wireChips('platChips','plat'); wireChips('typeChips','type');

  $('favToggle').addEventListener('click',()=>{state.favOnly=!state.favOnly;$('favToggle').setAttribute('aria-pressed',state.favOnly?'true':'false');render();});
  $('q').addEventListener('input',e=>{state.q=e.target.value;render();});
  $('genre').addEventListener('change',e=>{state.genre=e.target.value;render();});
  $('sort').addEventListener('change',e=>{state.sort=e.target.value;render();});
  $('viewtg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.view=b.dataset.view;
    $('viewtg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));render();});
  $('gear').addEventListener('click',()=>{
    const v=prompt("Colle ta clé API TMDB (v3) pour afficher les vraies affiches.\nLaisse le champ vide pour revenir aux vignettes.\n\nClé gratuite sur themoviedb.org → Paramètres → API.", tmdbKey);
    if(v===null) return;
    tmdbKey=v.trim();
    try{ tmdbKey?localStorage.setItem(TMDBK,tmdbKey):localStorage.removeItem(TMDBK); }catch(e){}
    if(!tmdbKey){ posters={}; savePosters(); }
    render();
  });

  /* ---- overlays helpers ---- */
  function openOv(id){$(id).classList.add('show');}
  function closeOv(id){$(id).classList.remove('show');}
  document.querySelectorAll('.ov .back[data-close]').forEach(b=>b.addEventListener('click',e=>closeOv(e.target.closest('.ov').id)));

  /* ---- détail (bottom sheet) ---- */
  function openSheet(m){
    if(!m)return;
    $('sheetBox').innerHTML = `
      <div class="shead" style="--g:${grad(m.t)}"><span class="grab"></span><span class="wm">${initials(m.t)}</span></div>
      <div class="sbody">
        <h3>${esc(m.t)}</h3>
        <div class="smeta">★ ${m.rating.toFixed(1)}/10 · ${typeLabel(m)} · ${m.year}</div>
        <div class="srow">
          <span class="pill plat ${m.plat}">${PLAT[m.plat]}</span>
          ${m.genre.split(" · ").map(g=>`<span class="pill">${esc(g)}</span>`).join("")}
        </div>
        ${watchBtn(m)}
      </div>
      <div class="sactions">
        <button class="btn-replay" id="sFav">${isFav(m.t)?'♥ Dans ma liste':'♡ Ajouter'}</button>
        <button class="btn-ok" id="sAgain">🎲 Autre idée</button>
      </div>`;
    loadHeadPoster($('sheetBox').querySelector('.shead'), m);
    $('sFav').onclick=()=>{toggleFav(m.t);$('sFav').textContent=isFav(m.t)?'♥ Dans ma liste':'♡ Ajouter';
      const card=resultsEl.querySelector(`[data-fav="${cssEsc(m.t)}"]`); if(card){const on=isFav(m.t);card.classList.toggle('on',on);card.textContent=on?'♥':'♡';}};
    $('sAgain').onclick=()=>{const pool=filtered.length?filtered:DATA;openSheet(pool[Math.floor(Math.random()*pool.length)]);};
    openOv('sheet');
  }
  const cssEsc = s => (window.CSS&&CSS.escape)?CSS.escape(s):s.replace(/["\\]/g,"\\$&");

  /* ---- roulette ---- */
  function rouletteCard(m,spinning){
    return `<div class="${spinning?'spinning':''}">
      <div class="rhead" style="--g:${grad(m.t)}"><span class="wm">${initials(m.t)}</span><span class="rrate">★ ${m.rating.toFixed(1)}</span></div>
      <div class="rbody">
        <div class="rkicker">${spinning?'On tire au sort…':'Ce soir, vous regardez'}</div>
        <h3>${esc(m.t)}</h3>
        <div class="rmeta">${typeLabel(m)} · ${m.year}</div>
        <div class="rtags"><span class="pill plat ${m.plat}">${PLAT[m.plat]}</span>${m.genre.split(" · ").map(g=>`<span class="pill">${esc(g)}</span>`).join("")}</div>
        ${spinning?'':`<div style="margin-bottom:12px">${watchBtn(m)}</div>`}
        <div class="ractions">
          <button class="btn-replay" id="rReplay">🎲 Rejouer</button>
          <button class="btn-ok" id="rOk">Parfait 🍿</button>
        </div>
      </div></div>`;
  }
  function spin(){
    const pool=filtered.slice();
    if(!pool.length)return;
    openOv('roul');
    let i=0, n=16, delay=55;
    (function step(){
      const m=pool[Math.floor(Math.random()*pool.length)];
      const last = i>=n;
      $('roulBox').innerHTML = rouletteCard(m,!last);
      if(!last){ i++; delay*=1.13; setTimeout(step,delay); }
      else { $('rReplay').onclick=spin; $('rOk').onclick=()=>closeOv('roul'); loadHeadPoster($('roulBox').querySelector('.rhead'), m); }
    })();
  }
  $('surprise').addEventListener('click',spin);

  /* ====================== MODE SWIPE (Tinder) ====================== */
  const sw = {plat:"all", type:"all", genre:"all", year:0, deck:[], idx:0, history:[]};
  const YEARS = [[0,"Toutes les années"],[2000,"Après 2000"],[2010,"Après 2010"],[2015,"Après 2015"],[2020,"Après 2020"]];

  function swMatches(){
    return DATA.filter(m=>{
      if(sw.plat!=="all" && m.plat!==sw.plat) return false;
      if(sw.type!=="all" && m.type!==sw.type) return false;
      if(sw.genre!=="all" && !m.genre.split(" · ").includes(sw.genre)) return false;
      if(sw.year && m.year < sw.year) return false;
      return true;
    });
  }

  function renderSetup(){
    const n = swMatches().length;
    $('swipeBox').innerHTML = `
      <div class="swtop"><h2>💘 Mode Swipe</h2><button class="close" id="swClose">✕</button></div>
      <div class="setup">
        <div class="lbl">Plateforme</div>
        <div class="chips" id="swPlat">
          ${[["all","Toutes"],["netflix","Netflix"],["prime","Prime Video"],["disney","Disney+"]].map(([v,l])=>
            `<button class="chip" data-plat="${v}" data-pl="${v}" aria-pressed="${sw.plat===v}">${l}</button>`).join("")}
        </div>
        <div class="lbl">Type</div>
        <div class="chips" id="swType">
          ${[["all","Tout"],["film","Films"],["serie","Séries"]].map(([v,l])=>
            `<button class="chip" data-ty="${v}" aria-pressed="${sw.type===v}">${l}</button>`).join("")}
        </div>
        <div class="lbl">Genre</div>
        <select id="swGenre"><option value="all">Tous les genres</option>${genres.map(g=>`<option value="${esc(g)}" ${sw.genre===g?'selected':''}>${esc(g)}</option>`).join("")}</select>
        <div class="lbl">Année de sortie</div>
        <select id="swYear">${YEARS.map(([v,l])=>`<option value="${v}" ${sw.year==v?'selected':''}>${l}</option>`).join("")}</select>
        <button class="start" id="swStart" ${n?'':'disabled'}>Commencer (${n} titre${n>1?'s':''}) →</button>
        <div class="hint">Glisse à droite ❤️ pour garder, à gauche ✕ pour passer.</div>
      </div>`;
    $('swClose').onclick=()=>closeOv('swipe');
    $('swPlat').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;sw.plat=b.dataset.pl;renderSetup();};
    $('swType').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;sw.type=b.dataset.ty;renderSetup();};
    $('swGenre').onchange=e=>{sw.genre=e.target.value;renderSetup();};
    $('swYear').onchange=e=>{sw.year=+e.target.value;renderSetup();};
    $('swStart').onclick=startDeck;
  }

  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  function startDeck(){
    sw.deck = shuffle(swMatches().slice());
    sw.idx = 0; sw.history = [];
    renderDeck();
  }

  function swCardHTML(m){
    return `<div class="swcard" style="--g:${grad(m.t)}">
      <span class="wm">${initials(m.t)}</span><span class="scrim"></span>
      <div class="stamp like">J'AIME</div><div class="stamp nope">PASSER</div>
      <div class="top"><span class="pill plat ${m.plat}">${PLAT[m.plat]}</span><span class="rate">★ ${m.rating.toFixed(1)}</span></div>
      <div class="cap">
        <h3>${esc(m.t)}</h3>
        <div class="m">${typeLabel(m)} · ${m.year}</div>
        <div class="tg">${m.genre.split(" · ").map(g=>`<span class="pill">${esc(g)}</span>`).join("")}</div>
      </div>
    </div>`;
  }

  function renderDeck(){
    const remaining = sw.deck.length - sw.idx;
    if(remaining<=0){ renderEnd(); return; }
    const stack = [];
    for(let k=Math.min(sw.idx+2, sw.deck.length-1); k>=sw.idx; k--){
      const scale = 1 - (k-sw.idx)*0.04, ty=(k-sw.idx)*10;
      stack.push(`<div class="swslot" data-k="${k}" style="position:absolute;inset:0;transform:translateY(${ty}px) scale(${scale});">${swCardHTML(sw.deck[k])}</div>`);
    }
    $('swipeBox').innerHTML = `
      <div class="swtop"><h2>💘 Swipe</h2><button class="close" id="swClose">✕</button></div>
      <div class="deck" id="deck">${stack.join("")}</div>
      <div class="swcontrols">
        <button class="swbtn undo" id="swUndo" ${sw.history.length?'':'disabled'} title="Annuler">↩</button>
        <button class="swbtn nope" id="swNope" title="Passer">✕</button>
        <button class="swbtn like" id="swLike" title="J'aime">♥</button>
      </div>`;
    $('swClose').onclick=()=>{ closeOv('swipe'); updateFavChip(); };
    $('swUndo').onclick=undo;
    $('swNope').onclick=()=>trigger('nope');
    $('swLike').onclick=()=>trigger('like');
    $('deck').querySelectorAll('.swslot').forEach(slot=>loadHeadPoster(slot.querySelector('.swcard'), sw.deck[+slot.dataset.k]));
    attachDrag();
  }

  let topCard=null, dragging=false, sx=0, sy=0, dx=0, dy=0;
  function attachDrag(){
    const deck=$('deck'); if(!deck)return;
    const slot=deck.querySelector('.swslot:last-child'); if(!slot)return;
    topCard=slot.querySelector('.swcard'); dx=0; dy=0;
    slot.style.touchAction="none";
    slot.addEventListener('pointerdown',onDown);
  }
  function onDown(e){ dragging=true; sx=e.clientX; sy=e.clientY; topCard.style.transition='none';
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
    e.currentTarget.addEventListener('pointermove',onMove);
    e.currentTarget.addEventListener('pointerup',onUp);
    e.currentTarget.addEventListener('pointercancel',onUp);
  }
  function onMove(e){ if(!dragging)return; dx=e.clientX-sx; dy=e.clientY-sy;
    topCard.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    topCard.querySelector('.stamp.like').style.opacity=Math.max(0,Math.min(1,dx/110));
    topCard.querySelector('.stamp.nope').style.opacity=Math.max(0,Math.min(1,-dx/110));
  }
  function onUp(){ if(!dragging)return; dragging=false;
    if(dx>105) fly('like'); else if(dx<-105) fly('nope');
    else { topCard.style.transition='transform .25s'; topCard.style.transform='';
      topCard.querySelector('.stamp.like').style.opacity=0; topCard.querySelector('.stamp.nope').style.opacity=0; }
  }
  function trigger(action){ if(!topCard||dragging)return; dy=0; fly(action); }
  function fly(action){
    if(!topCard)return;
    const dir = action==='like'?1:-1;
    topCard.style.transition='transform .32s ease-out, opacity .32s';
    topCard.style.transform=`translate(${dir*(window.innerWidth+200)}px,${dy}px) rotate(${dir*22}deg)`;
    topCard.style.opacity='0';
    topCard.querySelector('.stamp.'+action).style.opacity=1;
    topCard=null;
    setTimeout(()=>decide(action),190);
  }
  function decide(action){
    const m=sw.deck[sw.idx];
    let added=false;
    if(action==='like' && !isFav(m.t)){ toggleFav(m.t); added=true; }
    sw.history.push({action, added});
    sw.idx++;
    renderDeck();
  }
  function undo(){
    if(!sw.history.length)return;
    const last=sw.history.pop(); sw.idx--;
    if(last.action==='like' && last.added && isFav(sw.deck[sw.idx].t)) toggleFav(sw.deck[sw.idx].t);
    renderDeck();
  }
  function renderEnd(){
    const likes = sw.history.filter(h=>h.action==='like').length;
    $('swipeBox').innerHTML = `
      <div class="swtop"><h2>💘 Swipe</h2><button class="close" id="swClose">✕</button></div>
      <div class="deck"><div class="swend">
        <div class="big">${likes?'🍿':'🤷'}</div>
        <h3>${likes?`${likes} coup${likes>1?'s':''} de cœur !`:'Aucun coup de cœur'}</h3>
        <p>${likes?'Ajoutés à votre liste d\'envies ❤️':'Réessaie avec d\'autres filtres.'}</p>
        <div>
          ${likes?'<button class="primary" id="swSeeList">Voir ma liste ❤️</button>':''}
          <button class="ghost" id="swRestart">Recommencer</button>
        </div>
      </div></div>`;
    $('swClose').onclick=()=>{ closeOv('swipe'); updateFavChip(); };
    $('swRestart').onclick=renderSetup;
    const see=$('swSeeList'); if(see) see.onclick=()=>{
      closeOv('swipe');
      state.favOnly=true; $('favToggle').setAttribute('aria-pressed','true');
      updateFavChip(); render();
    };
  }
  $('swipeBtn').addEventListener('click',()=>{ renderSetup(); openOv('swipe'); });

  updateFavChip();
  render();
})();
</script>
</body>
</html>
